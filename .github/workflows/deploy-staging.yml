name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > "$HOME/.kube-config"
      - name: Apply manifests
        run: kubectl --kubeconfig "$HOME/.kube-config" apply -f deploy/k8s/
      - name: Wait for rollout
        run: node scripts/k8s-rollout.js ledger fraud
